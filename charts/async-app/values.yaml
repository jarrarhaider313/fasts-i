replicaCount: 1

api:
  image:
    repository: jarrar1412/async-api
    tag: "1.0"
    pullPolicy: Always
  env:
    secretKey: mysecretkey
    algorithm: HS256
    databaseUrl: postgresql+asyncpg://postgres:postgres@db:5432/taskdb
  service:
    type: LoadBalancer
    port: 80
    targetPort: 8000
  args:
    - uvicorn
    - mian:app
    - --host
    - 0.0.0.0
    - --port
    - "8000"

postgres:
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  database: taskdb
  user: postgres
  password: postgres
  service:
    port: 5432
    targetPort: 5432
  persistence:
    enabled: true
    size: 1Gi
