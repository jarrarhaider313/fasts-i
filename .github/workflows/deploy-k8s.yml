name: Deploy to k3d Kubernetes

on:
  workflow_run:
    workflows: ["FastAPI Docker CI/CD"]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Create kubeconfig
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"

          if [ -n "${KUBECONFIG_BASE64}" ]; then
            echo "${KUBECONFIG_BASE64}" | base64 --decode > "$HOME/.kube/config"
          elif [ -n "${KUBECONFIG_SECRET}" ]; then
            printf '%s' "${KUBECONFIG_SECRET}" > "$HOME/.kube/config"
          else
            echo "Missing kubeconfig secret. Add KUBECONFIG or KUBECONFIG_B64 in GitHub secrets."
            exit 1
          fi

          tr -d '\r' < "$HOME/.kube/config" > "$HOME/.kube/config.tmp"
          mv "$HOME/.kube/config.tmp" "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

          echo "Validating kubeconfig..."
          kubectl config view --raw >/dev/null

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/async-api --timeout=180s
          kubectl get pods
