apiVersion: apps/v1
kind: Deployment
metadata:
  name: async-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: async-api
  template:
    metadata:
      labels:
        app: async-api
    spec:
      containers:
        - name: async-api
          image: jarrar1412/async-api:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: secret_key
              value: mysecretkey
            - name: Algorithm
              value: HS256
            - name: DATABASE_URL
              value: postgresql+asyncpg://postgres:postgres@db:5432/taskdb
          args: ["uvicorn", "mian:app", "--host", "0.0.0.0", "--port", "8000"]
---
apiVersion: v1
kind: Service
metadata:
  name: async-api-service
spec:
  type: LoadBalancer
  selector:
    app: async-api
  ports:
    - port: 80
      targetPort: 8000
